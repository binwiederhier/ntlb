# The ntfy.sh site. This file is merged into config.yml (see include there): it could also hold
# more sites, global rules or other settings.
sites:
  - name: ntfy
    listen-http: ":80"
    listen-https: ":443"
    hosts: [ntfy.sh, "*.ntfy.sh"] # Leave out to take every host no other site on these listeners serves

    # Own access logs and bans settings for this site, instead of the global ones (optional;
    # usually the global ones are all there is)
    # access-logs:
    #   - file: /var/log/ntlb/ntfy.log
    # bans: {file: /var/log/ntlb/ntfy-ban.log, window: 10m, threshold: 100}

    # The certificate is re-read on reload. Running as a regular user, ntlb cannot read
    # /etc/letsencrypt: a certbot deploy hook copies the files to a directory ntlb owns, then runs
    # "systemctl reload ntlb" (see "Running as a regular user" in the README)
    cert-file: /etc/ntlb/certs/fullchain.pem
    key-file: /etc/ntlb/certs/privkey.pem

    # Long-lived streams (a request expression; bodyless requests only): they take the low-memory
    # stream path, a draining load balancer turns new ones away, and drains close them at a pace.
    # Default: none. ntfy's are its subscriptions, GET /<topics>/<json|sse|raw|ws>, minus polls
    # (poll=1 as a query parameter or header, read like ntfy's readParam).
    streams:
      match: method == "GET" && path matches "^/[-_A-Za-z0-9]{1,64}(,[-_A-Za-z0-9]{1,64})*/(json|sse|raw|ws)$" && !flag("x-poll", "poll", "po")

    # The servers, and how requests reach them (like nginx's upstream block)
    upstream:
      # How a request picks its server; the next ones are the retries, unhealthy servers last:
      #   round-robin  in turn (default, like nginx)
      #   least-conn   the fewest open requests on this load balancer, in turn among equals
      #   random-two   the less busy of two random ones (nginx's "random two least_conn"): balances
      #                like least-conn, also with several load balancers that each only see their own
      #   hash         the client key (client-key) hashed to server NAMES (rendezvous hashing), so
      #                every load balancer with the same names sends a client to the same server,
      #                and adding or removing one only moves the clients that ranked it first
      # ntfy: hash, so a client's subscriptions and publishes meet on one node
      balance: hash

      timeouts:
        connect: 5s # A server address that does not accept within this is down, try the next
        read: 3m    # Default 60s. Cut a response after this long without a byte (ntfy sends
                    # keepalives every 45s); also bounds a client that stops reading; a stalled
                    # upload is cut after 60s (like nginx's client_body_timeout), or this if shorter

      # TCP keepalive probes towards the servers; dead peers are detected after
      # idle + interval*count. Set "disable: true" to turn them off.
      keepalive:
        idle: 1m
        interval: 15s
        count: 4

      # Every address of every server is probed; a server is healthy if any address is, and an
      # address that fails is skipped until it passes again
      health-check:
        path: /v1/ready # Default /, healthy on any 2xx or 3xx; ntfy's readiness is 503 while draining or passive
        interval: 5s
        timeout: 3s
        fails: 3        # Failed probes in a row before a server leaves the rotation
        passes: 2       # Good probes in a row before it comes back

      # An address may be a port range, one address per port; each address holds up to ~63k
      # connections from one source IP. Example addresses:
      servers:
        - name: app1
          addresses: ["10.108.0.11:25010-25017"]
        - name: app3
          addresses: ["10.108.0.13:25010-25017"]
        - name: app5
          addresses: ["10.108.0.15:25010-25017"]

    # Rules of this site, checked after the global rules (see config.yml), and named "ntfy/<name>"
    rules:
      # The docs to docs.ntfy.sh (first, like nginx's "location /docs"), web pages to HTTPS, and
      # the website on HTTPS: GET / and its assets
      - name: docs-redirect
        match: path == "/docs" || path startsWith "/docs/"
        action: redirect
        location: '"https://docs.ntfy.sh/" + (path == "/docs" ? "" : trimPrefix(path, "/docs/"))'
      - name: https-redirect
        match: scheme == "http" && method == "GET" && uri matches "^/($|[-_a-z0-9]{0,64}$|docs/|static/|_next|_site)"
        action: redirect
        location: '"https://" + host + uri'
      - name: website-assets
        match: scheme == "https" && path matches "/(_site|_next)"
        action: static
        root: /var/www/website/html # No fallback: a missing asset is a 404
      - name: website
        match: scheme == "https" && method == "GET" && path == "/"
        action: static
        root: /var/www/website/html
        fallback: /index.html

      # Abusive topics: blocked, and banned if they keep coming. A strike above the bans threshold
      # bans on the first request.
      - name: abuse-topics
        match: path matches "(^/|,)(spam-[^,/]*|my-bets)(,|/|$)"
        action: block
        strike: 101
      - name: abuse-topic-count # Subscribing to 150+ topics at once
        match: path matches "^/[^/]*(,[^/,]*){150,}"
        action: block
        strike: 20

      # A request limit for everyone except a few known heavy users
      - name: limit-exempt
        match: ipIn(ip, "198.51.100.7", "203.0.113.0/24")
        action: allow
      - name: limit
        action: limit
        rate: 45/m
        burst: 1000
        status: 503 # What nginx's limit_req answers by default
        strike: 1
