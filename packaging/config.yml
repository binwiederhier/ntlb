# ntlb config. Reload with "systemctl reload ntlb" (SIGHUP) or "ntlb reload": everything but
# listen-admin, listen-metrics and client-keepalive applies without cutting a stream, the sites'
# listen addresses too (a reload says which changed settings need a restart). A config with an error is rejected as a whole, and the
# old one stays. Unknown keys are an error. Check a file with "ntlb check-config".
#
# Expressions (match, location) are in the expr language (https://expr-lang.org, also used by
# CrowdSec's filters) and are checked when the config loads:
#
#   method, path, query, uri, host, scheme ("http"/"https"), ip   the request (path is decoded,
#                                       uri is the path and query as sent)
#   header("Name")                      the first value of a header, "" if missing
#   flag("name", ...)                   whether the first of these set (headers first, then
#                                       query parameters) is 1, yes or true, like ntfy's params
#   ipIn(ip, "net", ...)                ip in any of these CIDR prefixes or addresses (literals)
#   site                                the name of the site serving the host ("" if none)
#   status, upstream_status, rule       response expressions only (access-logs, response rules):
#                                       the status sent, the upstream's (0: none answered), and
#                                       the rule that decided the request ("" if none did)
#   == != < > && || ! in matches (RE2) startsWith endsWith contains + ( ), lower(), trimPrefix(), ...

# Admin API (reload, drain, status), /metrics and pprof. No auth: keep it on localhost.
listen-admin: "127.0.0.1:2590"

# Only /metrics, e.g. for Prometheus on a private network (optional)
# listen-metrics: "10.108.0.2:25031"

# Access logs, in nginx's "combined" format plus key=value fields. A request goes to the first
# file whose match (a response expression) is true; one without match takes the rest. A site with
# its own access-logs uses those instead; requests that no site serves use these. A reload reopens
# the files (logrotate). No access-logs: no access log.
access-logs:
  - file: /var/log/ntlb/access.log
    match: status < 400
  - file: /var/log/ntlb/access_error.log

# TCP keepalive probes towards the clients and towards the upstreams. Dead peers are detected
# after idle + interval*count. Set "disable: true" to turn them off.
client-keepalive:
  idle: 1m
  interval: 15s
  count: 4
upstream-keepalive:
  idle: 1m
  interval: 15s
  count: 4

upstream-connect-timeout: 5s # A node that does not accept within this is down, try the next
upstream-read-timeout: 3m    # Cut a stream after this long without a byte (ntfy sends keepalives every 45s);
                             # also bounds a client that stops reading; a stalled upload is cut after
                             # 60s (like nginx's client_body_timeout), or this if shorter

drain-duration: 5m           # Default for "drain" commands and for upstreams removed from this file
shutdown-drain-duration: 2m  # SIGTERM: not ready right away, streams closed over this long

# What identifies a client for sticky routing, rate limits and bans: its IP, shortened to a prefix
# (like ntfy's visitor-prefix-bits-ipv4/-ipv6, so a client's limits stay on one node). Changing
# this re-routes clients, so keep it equal on all load balancers.
client-key:
  ipv4-prefix-bits: 32
  ipv6-prefix-bits: 64

# Bans: rules add strikes per client key; a client with more than threshold strikes within window
# gets one line in file ("<time> <ip> <prefix> <rule>"), which CrowdSec (or fail2ban) turns into a
# ban. A rule with a strike above the threshold bans on the first match. Strikes are not shared
# between load balancers; the ban tool shares the bans. Usually this is the only bans section; a
# site may have its own, which then counts its requests' strikes (global rules' too) separately.
bans:
  file: /var/log/ntlb/ban.log
  window: 10m
  threshold: 100

# Rules. Request rules are checked in order before a request is proxied: these global rules first,
# then the site's own. The first block, allow, redirect or static whose match is true decides, and
# so does a limit that is exceeded. Anything no rule decides is proxied. Response rules ("on: response") are all checked when a request ended,
# and only add strikes. A rule without match matches every request. A site's rules are named
# "<site>/<name>" in logs and metrics.
#
#   action: block      answer status (default 403)
#   action: limit      a token bucket per client key: rate (per s, m or h) plus burst at once,
#                      like nginx's limit_req burst=N nodelay; over it, answer status (default
#                      429); under it, check the next rules
#   action: allow      stop checking and proxy, e.g. to exempt clients from a limit
#   action: redirect   answer status (default 302) with location, a string expression
#   action: static     serve a file from root, or fallback (relative to root) for paths that are
#                      no file, like nginx's try_files $uri <fallback>
#   strike: N          strikes per match (block; limit: per limited request; response rules)
rules:
  # Abusive clients, for every site: blocked, and banned if they keep coming
  - name: abuse
    match: header("User-Agent") matches "(?i)ntfy-spy" || ipIn(ip, "192.0.2.0/24", "2001:db8:bad::/48")
    action: block
    strike: 20

  # Clients that keep sending requests the load balancer cannot even parse
  - name: bad-requests
    on: response
    match: status == 400 && upstream_status == 0
    strike: 1

# Included files are merged into this one, as if they were one big file: lists (sites, rules,
# access-logs) are appended in order (this file first, then each glob's files by name), and any
# other setting may be set in only one file. Globs are relative to this file's directory; only
# this file may include. Adding, changing or removing a file applies on reload.
include: [sites.d/*.yml]

# Sites: each has the addresses it listens on (listen-http, listen-https: one or a list; sites can
# share them), the hosts it serves there, its certificate, health checks, streams, upstreams,
# rules and optionally its own access logs. On each listener, a request goes to the site whose
# hosts match its Host header (exact names, then the longest "*.name" wildcard), else to the one
# site there without hosts; with none, it gets a 404. HTTPS serves HTTP/2 and HTTP/1.1, with the
# certificate of the listener's site that matches the client's SNI (else its first site's).
# A reload binds new listen addresses and closes removed ones (their open streams run on); only an
# address that switches between listen-http and listen-https needs a restart. See sites.d/ntfy.yml.
