# Releases: "make release" on a tag (git tag v0.1.0 && git push origin v0.1.0). The .deb goes to
# the GitHub release; the ansible role (roles/ntlb in ntfy-ansible) downloads it on each load
# balancer, checked against checksums.txt.
version: 2
builds:
  - id: ntlb_linux_amd64
    binary: ntlb
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X heckel.io/ntlb/cmd.version={{.Version}} -X heckel.io/ntlb/cmd.commit={{.ShortCommit}}"
    goos: [linux]
    goarch: [amd64]
nfpms:
  - package_name: ntlb
    homepage: https://github.com/binwiederhier/ntlb
    maintainer: Philipp C. Heckel <philipp.heckel@gmail.com>
    description: HTTP load balancer, built for ntfy
    formats:
      - deb
    bindir: /usr/bin
    contents:
      - src: pkg/config.yml
        dst: /etc/ntlb/config.yml
        type: "config|noreplace"
        file_info:
          mode: 0644
      - dst: /etc/ntlb/conf.d
        type: dir
        file_info:
          mode: 0755
      - src: pkg/ntlb.service
        dst: /lib/systemd/system/ntlb.service
        file_info:
          mode: 0644
    scripts:
      postinstall: pkg/scripts/postinst.sh
      preremove: pkg/scripts/prerm.sh
      postremove: pkg/scripts/postrm.sh
archives:
  - formats: [tar.gz]
    files:
      - README.md
      - pkg/config.yml
      - pkg/ntlb.service
checksum:
  name_template: checksums.txt
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
